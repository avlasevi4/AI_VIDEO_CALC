name: Check pricing and calculator

on:
  pull_request:
    paths:
      - 'data/pricing.json'
      - 'js/**'
      - 'scripts/**'
      - 'tests/**'
      - 'supabase/**'
      - 'vendor/**'
      - 'package.json'
      - '.github/workflows/check-pricing.yml'
  push:
    branches:
      - v2
    paths:
      - 'data/pricing.json'
      - 'js/**'
      - 'scripts/**'
      - 'tests/**'
      - 'supabase/**'
      - 'vendor/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
